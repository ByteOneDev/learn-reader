name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # L'app réelle (Electron) doit démarrer et afficher son interface : pas d'écran blanc.
      - run: xvfb-run -a npm run smoke
        env:
          SMOKE_NETWORK: '1'
      - run: npm run plugin:build
