name: Build desktop apps

# Produit les installeurs Mac (.dmg), Windows (.exe) et Linux (.AppImage, .deb)
# et les publie dans une release GitHub (onglet « Releases » du dépôt).
# - Pousser un tag vX.Y.Z publie la release vX.Y.Z.
# - Le lancer à la main (Actions → Build desktop apps → Run workflow) publie la release
#   correspondant à la version de package.json (et la met à jour si elle existe déjà).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package
        run: npm run dist
        env:
          # Pas de certificat Apple/Windows : signature ad hoc sur Mac, rien sur Windows.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: learn-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Learn ${{ steps.v.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body_path: .github/release-notes.md
          files: dist/*
