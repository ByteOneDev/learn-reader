name: Build desktop apps

# Produit les installeurs Mac (.dmg), Windows (.exe) et Linux (.AppImage, .deb)
# et les publie dans une release GitHub (onglet « Releases » du dépôt).
# - Chaque push sur main dont la version (package.json) n'a pas encore de release
#   construit et publie automatiquement la release vX.Y.Z (le tag est créé par GitHub).
#   Publier une nouvelle version = incrémenter "version" dans package.json.
# - Un tag vX.Y.Z poussé à la main publie aussi la release correspondante.
# - Le lancer à la main (Actions → Build desktop apps → Run workflow) reconstruit
#   et met à jour la release de la version courante.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(node -p 'require("./package.json").version')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/* ]] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $tag existe déjà : rien à publier."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Lance l'app réelle sur chaque système (vibrancy macOS, Mica Windows) : rien n'est publié si elle ne s'affiche pas.
      - run: npm run build
      - name: Test de fumée
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run smoke; else npm run smoke; fi
      - name: Package
        shell: bash
        env:
          # Signature macOS (voir docs/SIGNATURE-MAC.md). Secrets absents : signature ad hoc.
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CERTIFICATE_P12" ]; then
            export CSC_LINK="$MAC_CERTIFICATE_P12" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
              echo "::notice::Signature Developer ID et notarisation Apple."
              npm run dist
            else
              echo "::warning::Certificat fourni mais pas de clé API App Store Connect : app signée, non notarisée."
              npm run dist -- -c.mac.notarize=false
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "::notice::Pas de certificat Apple dans les secrets : signature ad hoc (voir docs/SIGNATURE-MAC.md)."
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist -- -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist
          fi
      - name: Vérifier la signature macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find release -maxdepth 2 -name 'Learn.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app" || echo "::warning::codesign --verify a signalé un problème (voir ci-dessus)."
          codesign -dv "$app" 2>&1 | grep -E 'Authority|Signature|TeamIdentifier' || true
          spctl --assess --type execute -vv "$app" || echo "::notice::Gatekeeper refuse cette app (normal sans notarisation)."
      - uses: actions/upload-artifact@v7
        with:
          name: learn-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  plugin:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extension Obsidian
        run: |
          npm run plugin:build
          cd obsidian-plugin/dist
          zip -r "../../learn-obsidian-${{ needs.check.outputs.tag }}.zip" learn-reader
      - uses: actions/upload-artifact@v7
        with:
          name: learn-obsidian
          path: learn-obsidian-*.zip
          if-no-files-found: error

  release:
    needs: [check, build, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Learn ${{ needs.check.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body_path: .github/release-notes.md
          files: dist/*
