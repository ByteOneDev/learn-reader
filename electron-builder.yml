appId: dev.byteone.learn
productName: Learn
copyright: Copyright © 2026 ByteOneDev
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
mac:
  category: public.app-category.news
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: resources/icon.png
  hardenedRuntime: false
  identity: "-"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Network;News;Office
  icon: resources/icon.png
  maintainer: ByteOneDev
